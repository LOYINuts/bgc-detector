[project]
name = "bgc-detector"
version = "1.0.0"
description = "Per-gene BGC detection from frozen ESMC-300M gene embeddings"
keywords = ["biosynthetic gene cluster", "BGC", "genome mining", "ESMC", "protein language model"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "biopython>=1.87",
    "esm>=3.5.0",
    "numpy>=2.5.0",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.9.0",
    "torch>=2.12.1",
    "tqdm>=4.68.3",
]

[dependency-groups]
dev = ["ruff>=0.14"]

[project.scripts]
bgc-detector = "bgc_detector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bgc_detector"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PIE", "RET"]
